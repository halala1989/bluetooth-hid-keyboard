plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hidble.phonekeyboard'
    compileSdk 34

    defaultConfig {
        minSdk 28
        targetSdk 34
        versionCode 30
        versionName "2.0"
    }

    // ===== 两个维度：target（三个目标） × edition（完整版/简明版） =====
    flavorDimensions "target", "edition"
    productFlavors {
        bt {
            dimension "target"
            applicationId "com.hidble.phonekeyboard"
            buildConfigField "String", "TARGET_MODE", '"bt"'
            buildConfigField "String", "BOARD_HINT", '""'
        }
        pico {
            dimension "target"
            applicationId "com.hidble.picokeyboard"
            buildConfigField "String", "TARGET_MODE", '"board"'
            buildConfigField "String", "BOARD_HINT", '"Pico"'
        }
        esp32 {
            dimension "target"
            applicationId "com.hidble.esp32keyboard"
            buildConfigField "String", "TARGET_MODE", '"board"'
            buildConfigField "String", "BOARD_HINT", '"ESP32"'
        }
        full {
            dimension "edition"
            buildConfigField "boolean", "LITE", "false"
        }
        lite {
            dimension "edition"
            buildConfigField "boolean", "LITE", "true"
            applicationIdSuffix ".lite"
            versionNameSuffix "-lite"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.activity:activity-ktx:1.8.1'
}

// 给每个变体计算应用显示名（简明版加后缀）
android.applicationVariants.all { variant ->
    def target = variant.productFlavors.find { it.dimension == 'target' }?.name
    def edition = variant.productFlavors.find { it.dimension == 'edition' }?.name
    def base = [bt: '手机蓝牙键盘', pico: 'Pico 蓝牙键盘', esp32: 'ESP32 蓝牙键盘'][target] ?: '蓝牙键盘'
    variant.mergedFlavor.manifestPlaceholders.put('appLabel', edition == 'lite' ? base + ' 简明版' : base)
}
