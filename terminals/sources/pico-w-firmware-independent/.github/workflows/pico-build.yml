name: Build Pico W Firmware (UF2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM cross toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Checkout Pico SDK (2.1.0, recursive for btstack/tinyusb/lwip/mbedtls)
        run: |
          git clone --recursive --branch 2.1.0 \
            https://github.com/raspberrypi/pico-sdk.git \
            "$GITHUB_WORKSPACE/pico-sdk"
          cd "$GITHUB_WORKSPACE/pico-sdk"
          git submodule update --init --recursive

      - name: Configure (PICO_BOARD=pico_w)
        run: |
          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          cmake -B build -DPICO_BOARD=pico_w -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        run: |
          cmake --build build -j4

      - name: List artifacts
        run: ls -la build/*.uf2 build/*.elf build/*.hex || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-keyboard-firmware
          path: |
            build/pico_w_keyboard_firmware.uf2
            build/pico_w_keyboard_firmware.elf
            build/pico_w_keyboard_firmware.hex
          if-no-files-found: error
